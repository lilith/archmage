# token-registry.toml — THE source of truth for archmage tokens & capabilities.
#
# Defines:
# - [[cap_slot]]: orthogonal atomic ISA capability slots per architecture
# - [[token]]:    concrete CPU proof tokens and feature sets
# - [[trait]]:    sealed capability marker traits backed by [[cap_slot]] requirements
# - [[width_namespace]], [[polyfill_w256]], [[polyfill_w512]]
#
# LLVM deduplicates redundant features in #[target_feature] — listing
# the full set per token/trait is harmless and guarantees exact matching.
#
# NOTE: x86 feature lists include sse/sse2 (the x86_64 baseline) because many
# core::arch intrinsics require "sse" / "sse2" explicitly in #[target_feature].

# ──── Capability Slots ────

[[cap_slot]]
arch = "x86"
name = "V1"
features = ["sse", "sse2"]

[[cap_slot]]
arch = "x86"
name = "V2"
features = ["sse3", "ssse3", "sse4.1", "sse4.2", "popcnt", "cmpxchg16b"]

[[cap_slot]]
