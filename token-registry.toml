parents = ["HasNeon", "HasNeonAes", "HasNeonSha2", "HasNeonCrc", "HasNeonRdm", "HasNeonDotProd", "HasNeonFp16"]
cap_req = ["Neon", "Crc", "Rdm", "DotProd", "Fp16", "Aes", "Sha2"]
magetypes_namespace = "neon"
doc = "Marker trait for Arm64-v2 level (NEON, CRC, RDM, DotProd, FP16, AES, SHA2)."

[[trait]]
