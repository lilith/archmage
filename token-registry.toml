magetypes_namespace = "neon"
doc = "Marker trait for Arm64-v3 level (adds FHM, FCMA, SHA3, I8MM, BF16)."

# WASM traits

[[trait]]
name = "HasWasm128"
arch = "wasm32"
features = ["simd128"]
cap_req = ["Simd128"]
magetypes_namespace = "wasm128"
doc = "Marker trait for WASM SIMD128."

[[trait]]
name = "HasWasm128Relaxed"
arch = "wasm32"
features = ["simd128", "relaxed-simd"]
parents = ["HasWasm128"]
cap_req = ["Simd128", "Relaxed"]
magetypes_namespace = "wasm128"
doc = "Marker trait for WASM Relaxed SIMD."

[[trait]]
name = "HasWasm128RelaxedFma"
arch = "wasm32"
features = ["simd128", "relaxed-simd"]
parents = ["HasWasm128Relaxed"]
cap_req = ["Simd128", "Relaxed", "RelaxedFma"]
runtime_probe = true
magetypes_namespace = "wasm128"
doc = "Marker trait for WASM Relaxed SIMD with runtime-probed single-rounding FMA fusion."

